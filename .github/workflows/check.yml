name: Check Carlito
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path app/Cargo.toml -- --check
      - run: cargo test --manifest-path app/Cargo.toml --locked
      - run: bash -n scripts/*.sh quill/build.sh
